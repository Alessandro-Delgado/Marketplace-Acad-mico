<section class="container py-5">
  
  <div
    *ngIf="loading"
    class="text-center py-5">

    <div
      class="spinner-border"
      role="status">
    </div>

    <p class="mt-3">
      Cargando producto...
    </p>

  </div>

  <div
    *ngIf="!loading && errorMessage"
    class="alert alert-danger">

    {{ errorMessage }}

  </div>

  <div
    *ngIf="!loading && producto"
    class="card border-0 shadow-sm rounded-4 product-detail-card">

    <div class="row g-0">

      <div class="col-12 col-lg-6">

        <div class="detail-image-container">

          <img
            [src]="producto.img_prod || 'assets/imgs/placeholder.png'"
            [alt]="producto.nom_prod"
            class="detail-image"
            onerror="this.src='assets/imgs/placeholder.png'">

        </div>

      </div>

      <div class="col-12 col-lg-6">

        <div class="p-4 p-lg-5">

          <span class="badge category-badge mb-3">

            {{ producto.categoria || 'Producto' }}

          </span>


          <h1 class="fw-bold mb-3">

            {{ producto.nom_prod }}

          </h1>


          <div class="mb-4">

            <span class="detail-price">

              S/ {{ producto.precio | number:'1.2-2' }}

            </span>

          </div>


          <div class="product-info-list">

            <div class="info-row">

              <span>
                <i class="fa-solid fa-box me-2"></i>
                Stock
              </span>

              <strong>
                {{ producto.stock }}
              </strong>

            </div>


            <div class="info-row">

              <span>
                <i class="fa-solid fa-circle-info me-2"></i>
                Estado
              </span>

              <strong>
                {{ producto.estado }}
              </strong>

            </div>


            <div class="info-row">

              <span>
                <i class="fa-solid fa-layer-group me-2"></i>
                Categoría
              </span>

              <strong>
                {{ producto.categoria || producto.cat_prodid }}
              </strong>

            </div>

          </div>


          <div class="d-flex gap-2 mt-5">

            <button
              type="button"
              class="btn btn-outline-secondary flex-fill"
              (click)="volver()">

              <i class="fa-solid fa-arrow-left me-2"></i>
              Volver

            </button>


            <button
              type="button"
              class="btn btn-danger flex-fill"
              (click)="eliminarProducto()">

              <i class="fa-solid fa-trash me-2"></i>
              Eliminar

            </button>

          </div>

        </div>

      </div>

    </div>

  </div>

</section>
